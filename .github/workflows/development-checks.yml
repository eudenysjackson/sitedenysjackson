name: Check development without publishing
on:
  push:
    branches: ['development/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-admin-isolation.js
      - run: node scripts/test-static-build.js
      - run: node scripts/build-static.js
      - run: node scripts/setup-development.js
      - run: node scripts/test-development-browser.js
